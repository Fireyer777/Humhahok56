<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabudbob Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #000;
  color: white;
  text-align: center;
}

/* POPUP */
#popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.popup-box {
  background: #111;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0 20px #00ffcc;
}

.btn {
  padding: 15px 30px;
  background: #00ffcc;
  color: black;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 20px;
  display: inline-block;
}

/* MAIN */
.container {
  padding: 50px 20px;
}

.card {
  margin-top: 30px;
  padding: 20px;
  background: #111;
  border-radius: 15px;
}

.btn-main {
  padding: 15px 30px;
  background: #00ffcc;
  color: black;
  border-radius: 50px;
  text-decoration: none;
  display: inline-block;
  margin-top: 20px;
}
</style>
</head>

<body>

<!-- 🔥 POPUP -->
<div id="popup">
  <div class="popup-box">
    <h2>⚠️ ยืนยันก่อนเข้า</h2>
    <p>กดเพื่อเข้าสู่เว็บไซต์</p>
    <div class="btn" onclick="enterSite()">เข้าเว็บ</div>
  </div>
</div>

<!-- 🔊 เสียง -->
<audio id="clickSound">
  <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mpeg">
</audio>

<!-- 🔥 MAIN -->
<div class="container">
  <h1>🔥 SABUDBOB 🔥</h1>

  <div class="card">
    <h2>🚀 สุ่มลิงก์</h2>
    <p>กดแล้วจะสุ่มไปหน้าอื่น</p>
    <div class="btn-main" onclick="randomLink()">กดสุ่ม</div>
  </div>
</div>

<script>

// 🔥 ลิงก์สุ่ม (แก้ตรงนี้ได้)
const links = [
  "https://google.com",
  "https://youtube.com",
  "https://facebook.com"
];

// 🔊 เล่นเสียง
function playSound() {
  document.getElementById("clickSound").play();
}

// 🔥 ปิด popup
function enterSite() {
  playSound();
  document.getElementById("popup").style.display = "none";
}

// 🔥 สุ่มลิงก์
function randomLink() {
  playSound();
  const random = links[Math.floor(Math.random() * links.length)];
  window.location.href = random;
}

</script>

</body>
</html>
